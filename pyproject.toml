[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "FraudPulse"
version = "0.1.0"
description = "FastAPI project"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "pytest>=8.0",
    "ruff>=0.6",
    "uvicorn>=0.30",
]
